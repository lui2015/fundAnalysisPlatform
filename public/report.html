<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="description" content="基金六维分析报告：总览 / 好业绩 / 好舵手 / 好体验 / 好时机与成本 / 风险排雷。AI 生成，不构成投资建议。">
<title>基金分析报告 · 基金分析平台</title>
<link rel="stylesheet" href="css/style.css">
<script>
  (function () {
    try {
      // 默认暗色（赛博朋克风格），忽略系统偏好；仅手动切浅色时跟随 localStorage
      var t = localStorage.getItem('fap_theme');
      if (!t) t = 'dark';
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="logo" href="index.html"><i class="logo__mark"></i>基金分析平台</a>
    <span class="topbar__spacer"></span>
    <a class="topbar__link" href="index.html">重新搜索</a>
    <a class="topbar__link" href="rules.html">评分口径</a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换明暗主题">☾</button>
  </div>
</header>

<!-- 基金信息条：移动端压缩为吸顶两行细条，桌面端单行 + 右侧操作按钮组 -->
<div class="fundbar">
  <div class="fundbar__inner">
    <div class="fundbar__row1">
      <span class="fundbar__name" id="fb-name">加载中…</span>
      <span class="tag" id="fb-code"></span>
      <span class="tag tag--type" id="fb-type"></span>
      <span class="tag tag--share hidden" id="fb-share"></span>
      <span class="topbar__spacer"></span>
      <span class="fundbar__nav" id="fb-nav"></span>
      <span id="fb-chg" style="font-size:13px;font-family:var(--font-mono)"></span>
      <span class="fundbar__btns">
        <button class="btn-ghost" id="btn-detail" type="button">档案</button>
        <button class="btn-ghost" id="btn-watch" type="button">加自选</button>
        <button class="btn-ghost" id="btn-share" type="button">复制链接</button>
        <button class="btn-ghost" id="btn-copy" type="button">复制总览</button>
        <button class="btn-primary" id="btn-again" type="button">重新分析</button>
      </span>
    </div>
    <div class="fundbar__row2" id="fb-meta"></div>
  </div>
</div>

<!-- 移动端六板块吸顶横滑 Tab（桌面端隐藏，改用右侧常驻锚点） -->
<nav class="navtabs" id="navtabs" aria-label="板块导航">
  <div class="navtabs__inner" id="navtabs-inner"></div>
</nav>

<main class="wrap">
  <div class="report-layout">
    <div id="content">
      <div class="progress" id="progress">
        <div class="progress__bar"><div class="progress__fill" id="progress-fill"></div></div>
        <div class="progress__text"><span class="spinner"></span><span id="progress-text">正在准备分析…</span></div>
      </div>
      <div id="sections"></div>

      <section class="card" id="sources-card">
        <div class="section-title" style="margin-top:0">数据来源与免责声明</div>
        <div id="sources-list" style="font-size:12px;color:var(--c-text-2);line-height:1.9"></div>
        <div id="disclaimer-box" style="font-size:12px;color:var(--c-text-3);line-height:1.8;margin-top:8px"></div>
        <div style="margin-top:8px">
          <span class="tag">AI 生成内容</span>
          <span class="tag">不构成投资建议</span>
          <span class="tag">不推荐基金</span>
          <span class="tag">过往业绩不预示未来</span>
        </div>
      </section>
    </div>

    <!-- 桌面端右侧：吸顶基金信息 + 六板块锚点导航（常驻显示分数与风险灯） -->
    <aside class="sidebar">
      <div class="sidebar__card">
        <div style="font-size:12px;color:var(--c-text-3);margin-bottom:6px">四刻度 + 风险灯</div>
        <div id="side-scores" style="font-size:13px;line-height:2"></div>
      </div>
      <div class="sidebar__card">
        <div style="font-size:12px;color:var(--c-text-3);margin-bottom:6px">板块导航（快捷键 1–6）</div>
        <div class="sidebar__nav" id="side-nav"></div>
      </div>
    </aside>
  </div>
</main>

<!-- 移动端底部固定操作栏（安全区内，不遮挡内容） -->
<div class="actionbar">
  <button class="btn-ghost" id="btn-watch-m" type="button">自选</button>
  <button class="btn-ghost" id="btn-copy-m" type="button">复制总览</button>
  <button class="btn-ghost" id="btn-share-m" type="button">分享</button>
  <button class="btn-primary" id="btn-again-m" type="button">重新分析</button>
</div>

<script src="js/common.js"></script>
<script src="js/charts.js"></script>
<script src="js/report.js"></script>
</body>
</html>
