<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 移动端适配：允许双指缩放图表，但输入框聚焦不触发页面缩放（字号 ≥16px 保证） -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060f">
<meta name="description" content="输入基金名称或代码，AI 按「总览 / 好业绩 / 好舵手 / 好体验 / 好时机与成本 / 风险排雷」六个角度输出结构化解读。内容由 AI 生成，不构成投资建议，不推荐基金。">
<title>基金分析平台 · 六个角度看懂一只基金</title>
<link rel="stylesheet" href="css/style.css?v=2">
<script>
  // 首屏渲染前应用主题，避免明暗切换闪烁
  (function () {
    try {
      // 默认暗色（赛博朋克风格），忽略系统偏好；仅在用户曾手动切到浅色时跟随 localStorage
      var t = localStorage.getItem('fap_theme');
      if (!t) t = 'dark';
      if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  })();
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <span class="logo"><i class="logo__mark"></i>基金分析平台</span>
    <span class="topbar__spacer"></span>
    <a class="topbar__link" href="rules.html">评分口径</a>
    <button class="topbar__link" id="btn-history" type="button">历史报告</button>
    <button class="topbar__link" id="btn-watchlist" type="button">我的自选 <span id="watch-count" class="tag">0</span></button>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">☾</button>
  </div>
</header>

<main class="wrap">

  <section class="hero">
    <h1>帮你快速看懂一只基金</h1>
    <p>输入基金名称或代码，AI 依据公开数据给出结构化解读 · 不推荐基金 · 不预测收益</p>

    <div class="searchbox" id="searchbox">
      <div class="searchbox__field">
        <span class="searchbox__icon" aria-hidden="true">🔍</span>
        <input id="q" type="search" inputmode="search" autocomplete="off" autocapitalize="off"
               spellcheck="false" placeholder="基金名称 / 6 位代码 / 拼音首字母，如 白酒、161725、zsbj"
               aria-label="基金搜索" aria-controls="suggest" aria-expanded="false">
        <button class="btn-primary" id="btn-search" type="button">分析</button>
      </div>

      <!-- 移动端为全屏覆盖层，桌面端为输入框下方浮层 -->
      <div class="suggest" id="suggest" role="listbox" aria-label="搜索结果">
        <div class="suggest__head">
          <input id="q-mobile" type="search" inputmode="search" autocomplete="off"
                 style="flex:1;border:0;outline:0;background:transparent;font-size:16px;height:44px;color:inherit"
                 placeholder="搜索基金" aria-label="基金搜索">
          <button class="btn-ghost" id="btn-suggest-close" type="button">取消</button>
        </div>
        <div class="suggest__list" id="suggest-list"></div>
      </div>
    </div>
  </section>

  <section id="recent-wrap" class="hidden">
    <div class="section-title">最近搜索<button class="clamp-toggle" id="btn-recent-clear" type="button" style="margin-left:auto">清除</button></div>
    <div class="chips" id="recent-list"></div>
  </section>

  <section id="watchlist-wrap" class="hidden">
    <div class="section-title">我的自选 <small>点击可直接分析</small></div>
    <div class="chips" id="watchlist-list"></div>
  </section>

  <section id="hot-section">
    <div class="hot__header">
      <div class="section-title">热门基金 <small>按平台分析次数排序，不按收益率排序</small></div>
      <div class="hot__filters" id="hot-filters"></div>
    </div>
    <div class="hot-grid" id="hot-list"></div>
    <div class="hot__footer"><button class="btn-ghost btn-sm" id="btn-hot-all" type="button">查看全部 →</button></div>
  </section>

  <!-- 热门基金「查看全部」侧拉面板 -->
  <div class="drawer" id="hot-drawer" role="dialog" aria-modal="true">
    <div class="drawer__overlay"></div>
    <div class="drawer__panel">
      <div class="drawer__head">
        <h2 class="drawer__title">全部热门基金</h2>
        <button class="drawer__close" id="btn-hot-close" type="button" aria-label="关闭">✕</button>
      </div>
      <div class="drawer__body" id="hot-drawer-body">
        <div class="hot__filters" id="hot-drawer-filters"></div>
        <div class="hot-grid hot-grid--dense" id="hot-drawer-list"></div>
      </div>
    </div>
  </div>

  <footer class="footer">
    <b>免责声明</b><br>
    <span id="disclaimer-text"></span>
    <div style="margin-top:8px">
      <span class="tag">AI 生成内容</span>
      <span class="tag">不构成投资建议</span>
      <span class="tag">不推荐基金 · 不销售基金</span>
      <span class="tag">过往业绩不预示未来</span>
    </div>
  </footer>
</main>

<!-- 历史报告侧拉面板 -->
<div class="drawer" id="history-drawer" role="dialog" aria-modal="true">
  <div class="drawer__overlay"></div>
  <div class="drawer__panel">
    <div class="drawer__head">
      <h2 class="drawer__title">历史报告 <small>点击查看只读快照</small></h2>
      <button class="drawer__close" id="btn-history-close" type="button" aria-label="关闭">✕</button>
    </div>
    <div class="drawer__body" id="history-list"></div>
  </div>
</div>

<script src="js/common.js?v=3"></script>
<script src="js/app.js?v=3"></script>
</body>
</html>
